<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIE Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:#0f172a; --ink-2:#16203a; --bone:#f7f5f0; --soft:#eeece7; --tint:#f2efe9;
    --gold:#b8963e; --slate:#4b5563; --line:#e4e0d8; --hair:#edeae3; --red:#8b1a1a;
    --nav-text:rgba(240,237,229,.66); --nav-on:#f7f5f0;
    --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    --read:"EB Garamond",Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --lift:0 1px 2px rgba(15,23,42,.05), 0 12px 30px rgba(15,23,42,.06);
    --nav:274px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bone); color:var(--ink);
    font-family:var(--sys); font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-.006em; }
  button, input, textarea, select { font:inherit; color:inherit; background:none; border:none; letter-spacing:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid rgba(15,23,42,.35); outline-offset:2px; border-radius:var(--r-xs); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(15,23,42,.16); border-radius:var(--r-pill); border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-track { background:transparent; }

  .app { display:flex; height:100%; }

  /* ---------- dark nav ---------- */
  .nav { width:var(--nav); flex:none; background:var(--ink); color:var(--nav-text); display:flex; flex-direction:column; min-height:0; }
  .app[data-nav="closed"] .nav { display:none; }
  .nav ::-webkit-scrollbar-thumb { background:rgba(247,245,240,.18); background-clip:content-box; }

  .brand { display:flex; align-items:center; gap:12px; padding:20px 18px; border-bottom:1px solid rgba(247,245,240,.09); }
  .brand .sq { width:34px; height:34px; border-radius:var(--r-xs); background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--read); font-size:20px; font-weight:500; }
  .brand b { color:var(--nav-on); font-family:var(--read); font-size:23px; font-weight:500; letter-spacing:.10em; }
  .brand .col { margin-left:auto; color:var(--nav-text); padding:6px 8px; border-radius:var(--r-xs); }
  .brand .col:hover { color:var(--nav-on); background:rgba(247,245,240,.07); }

  .ws { margin:14px 14px 8px; padding:11px 14px; border:1px solid rgba(247,245,240,.12); border-radius:var(--r-sm); display:flex; align-items:center; gap:10px; width:calc(100% - 28px); text-align:left; }
  .ws:hover { background:rgba(247,245,240,.05); }
  .ws .dot { width:7px; height:7px; border-radius:50%; background:var(--gold); flex:none; }
  .ws .txt { min-width:0; }
  .ws .txt b { display:block; color:var(--nav-on); font-size:13.5px; font-weight:600; }
  .ws .txt span { font-size:11.5px; }
  .ws .car { margin-left:auto; font-size:10px; }

  .navscroll { flex:1; overflow-y:auto; padding:8px 0 20px; min-height:0; }
  .navlabel { padding:16px 20px 8px; font-size:10.5px; letter-spacing:.14em; color:rgba(240,237,229,.42); }
  .navlabel button { color:rgba(240,237,229,.42); font-size:14px; float:right; line-height:1; padding:0 4px; }
  .navlabel button:hover { color:var(--nav-on); }

  .navitem { display:flex; align-items:center; gap:12px; width:calc(100% - 20px); margin:2px 10px; padding:10px 12px; border-radius:var(--r-xs); text-align:left; color:var(--nav-text); }
  .navitem:hover { background:rgba(247,245,240,.06); color:var(--nav-on); }
  .navitem[aria-current="true"] { background:rgba(184,150,62,.16); color:var(--nav-on); box-shadow:inset 2px 0 0 var(--gold); }
  .navitem .ic { width:18px; flex:none; opacity:.8; font-size:14px; text-align:center; }
  .navitem .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
  .navitem .ct { margin-left:auto; font-size:11.5px; font-variant-numeric:tabular-nums; opacity:.7; }
  .navitem.dragover { background:rgba(184,150,62,.28); color:var(--nav-on); }

  .navfoot { border-top:1px solid rgba(247,245,240,.09); padding:14px 18px; display:flex; align-items:center; gap:11px; }
  .navfoot .av { width:32px; height:32px; border-radius:50%; background:rgba(247,245,240,.12); color:var(--nav-on); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
  .navfoot b { display:block; color:var(--nav-on); font-size:13px; font-weight:600; }
  .navfoot span { font-size:11px; }

  /* ---------- content ---------- */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:center; gap:10px; padding:12px 28px; border-bottom:1px solid var(--hair); }
  .burger { display:none; }
  .find { margin-left:auto; width:260px; max-width:40vw; padding:8px 16px; background:var(--tint); border:1px solid var(--line); border-radius:var(--r-pill); font-size:13.5px; }
  .find:focus { outline:none; border-color:var(--slate); background:var(--bone); }
  .kbd { font-family:var(--mono); font-size:10.5px; color:var(--slate); border:1px solid var(--line); border-radius:6px; padding:3px 7px; }

  .scroll { flex:1; overflow:auto; min-height:0; }
  .head { padding:32px 40px 0; }
  .head .rule { height:1px; background:var(--gold); margin-bottom:22px; }
  .head .eyebrow { font-size:11px; letter-spacing:.16em; color:var(--gold); }
  .head h1 { margin:6px 0 0; font-size:27px; font-weight:400; font-family:var(--read); color:var(--slate); letter-spacing:0; }
  .head .row { display:flex; align-items:flex-start; gap:16px; }
  .head .row .grow { flex:1; min-width:0; }
  .btn { background:var(--ink); color:var(--bone); border-radius:var(--r-sm); padding:13px 22px; font-size:13px; letter-spacing:.06em; display:inline-flex; align-items:center; gap:9px; }
  .btn:hover { background:var(--ink-2); }
  .btn.ghost { background:transparent; color:var(--slate); border:1px solid var(--line); }
  .btn.ghost:hover { color:var(--ink); border-color:var(--slate); background:transparent; }

  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:26px 40px 0; }
  .seg { display:inline-flex; background:var(--tint); border-radius:var(--r-pill); padding:3px; }
  .seg button { padding:8px 16px; font-size:13px; color:var(--slate); border-radius:var(--r-pill); }
  .seg button[aria-pressed="true"] { background:var(--bone); color:var(--ink); box-shadow:var(--lift); }
  .chip { border:1px solid var(--line); border-radius:var(--r-pill); padding:7px 15px; font-size:12.5px; color:var(--slate); background:var(--bone); }
  .chip:hover { color:var(--ink); border-color:var(--slate); }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--bone); }
  .selbox { border:1px solid var(--line); border-radius:var(--r-pill); background:var(--bone); padding:7px 14px; font-size:12.5px; color:var(--slate); }

  .pill { display:inline-flex; align-items:center; font-family:var(--mono); font-size:10.5px; letter-spacing:.02em; color:var(--slate); border:1px solid var(--line); border-radius:6px; padding:3px 9px; background:var(--bone); white-space:nowrap; }
  .pill.on { background:var(--ink); border-color:var(--ink); color:var(--bone); }
  .pill.gold { border-color:var(--gold); color:#8c6f26; }

  .pad { padding:26px 40px 64px; }
  .note { color:var(--slate); font-size:13px; }

  /* domain cards */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(266px,1fr)); gap:20px; }
  .dcard { border:1px solid var(--line); border-radius:var(--r-md); background:var(--bone); padding:22px; text-align:left; cursor:pointer; }
  .dcard:hover { border-color:transparent; box-shadow:var(--lift); }
  .dcard.dragover { border-color:var(--gold); background:var(--tint); }
  .dcard h3 { margin:0 0 4px; font-size:19px; font-weight:600; letter-spacing:-.018em; }
  .dcard p { margin:0 0 16px; color:var(--slate); font-size:13px; }
  .dcard .stats { display:flex; gap:7px; flex-wrap:wrap; }

  /* feature rows */
  .rows { border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; background:var(--bone); }
  .frow { display:flex; align-items:center; gap:16px; padding:15px 20px; border-bottom:1px solid var(--hair); cursor:grab; }
  .frow:last-child { border-bottom:0; }
  .frow:hover { background:var(--tint); }
  .frow.dragging { opacity:.4; }
  .frow.dragover { box-shadow:inset 0 2px 0 var(--gold); }
  .frow .seq { font-family:var(--mono); font-size:12px; color:var(--slate); min-width:26px; }
  .frow .grip { color:var(--line); font-size:14px; }
  .frow .body { flex:1; min-width:0; }
  .frow .body b { display:block; font-size:14.5px; font-weight:600; letter-spacing:-.012em; }
  .frow .body span { color:var(--slate); font-size:12.5px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frow .tags { display:flex; gap:6px; flex-wrap:wrap; }
  .frow select { border:1px solid var(--line); border-radius:var(--r-pill); background:var(--bone); padding:6px 12px; font-size:12px; color:var(--slate); }
  .frow .go { color:var(--slate); padding:6px 10px; border-radius:var(--r-pill); }
  .frow .go:hover { color:var(--ink); background:var(--soft); }

  /* lanes */
  .lanes { display:flex; gap:18px; overflow-x:auto; align-items:flex-start; padding-bottom:12px; }
  .lane { flex:0 0 264px; min-width:264px; }
  .lane > h2 { margin:0 0 12px; padding-bottom:10px; font-size:12px; letter-spacing:.1em; border-bottom:1px solid var(--gold); display:flex; align-items:center; gap:8px; text-transform:uppercase; }
  .lane > h2 em { font-style:normal; color:var(--slate); font-size:11.5px; margin-left:auto; letter-spacing:0; }
  .lane .drop { min-height:88px; border-radius:var(--r-md); padding:2px; }
  .drop.over { background:var(--tint); }
  .card { background:var(--bone); border:1px solid var(--line); border-radius:var(--r-md); padding:15px 17px; margin-bottom:10px; cursor:grab; }
  .card:hover { border-color:transparent; box-shadow:var(--lift); }
  .card h3 { margin:0 0 5px; font-size:14px; font-weight:600; letter-spacing:-.012em; }
  .card p { margin:0; color:var(--slate); font-size:12.5px; }
  .card .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:11px; }
  .card.dragging { opacity:.4; }
  .card.dragover { box-shadow:0 -2px 0 var(--gold); }
  .cardsel { display:none; margin-top:11px; width:100%; border:1px solid var(--line); border-radius:var(--r-pill); background:var(--bone); padding:6px 12px; font-size:12.5px; color:var(--slate); }
  .colplus { border:1px dashed var(--line); border-radius:var(--r-md); width:100%; padding:11px; color:var(--slate); font-size:12.5px; margin-bottom:10px; }
  .colplus:hover { border-color:var(--slate); color:var(--ink); }

  /* feature detail */
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:32px; }
  .panel { border:1px solid var(--line); border-radius:var(--r-md); padding:20px 22px; background:var(--bone); }
  .panel h3 { margin:0 0 14px; font-size:11px; letter-spacing:.14em; color:var(--gold); text-transform:uppercase; }
  .field { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--hair); font-size:13px; }
  .field:last-child { border-bottom:0; }
  .field label { color:var(--slate); min-width:78px; font-size:12.5px; }
  .field select, .field input { flex:1; min-width:0; border:1px solid var(--line); border-radius:var(--r-pill); background:var(--bone); padding:7px 13px; font-size:12.5px; }
  .writer { width:100%; min-height:280px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bone); padding:22px 24px; resize:vertical; font-family:var(--read); font-size:18px; line-height:1.6; }
  .writer:focus { outline:none; border-color:var(--slate); }

  .menu-wrap { position:relative; display:inline-block; }
  .menu { position:absolute; right:0; top:46px; z-index:20; min-width:230px; background:var(--bone); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--lift); padding:6px; }
  .menu button { display:block; width:100%; text-align:left; padding:10px 14px; font-size:13.5px; border-radius:var(--r-xs); }
  .menu button:hover { background:var(--soft); }
  .menu button.warn:hover { color:var(--red); }
  .menu .sep { height:1px; background:var(--hair); margin:6px 8px; }

  .empty { border:1px dashed var(--line); border-radius:var(--r-md); padding:44px; text-align:center; color:var(--slate); font-family:var(--read); font-size:17px; }


  /* ---------- gantt timeline ---------- */
  .gantt { overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bone); }
  .gt { display:grid; min-width:max-content; }
  .gt .hd { position:sticky; top:0; z-index:3; background:var(--tint); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate); padding:13px 10px; border-bottom:1px solid var(--gold); text-align:center; white-space:nowrap; }
  .gt .hd.first { left:0; z-index:4; text-align:left; padding-left:18px; }
  .gt .hd.now { color:var(--ink); background:var(--soft); }
  .gt .nc { position:sticky; left:0; z-index:2; background:var(--bone); padding:12px 18px; border-bottom:1px solid var(--hair); border-right:1px solid var(--line); display:flex; align-items:center; gap:10px; cursor:pointer; }
  .gt .nc b { font-size:13.5px; font-weight:600; letter-spacing:-.012em; display:block; }
  .gt .nc span { font-size:11.5px; color:var(--slate); }
  .gt .nc .seqn { font-family:var(--mono); font-size:11px; color:var(--slate); min-width:22px; }
  .gt .cell { border-bottom:1px solid var(--hair); border-right:1px solid var(--hair); min-height:58px; padding:10px 8px; }
  .gt .cell.over { background:var(--tint); }
  .gt .cell.nowcol { background:rgba(184,150,62,.05); }
  .gt .bar { background:var(--ink); color:var(--bone); border-radius:var(--r-pill); padding:7px 13px; font-size:11.5px; cursor:grab; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gt .bar.live { background:var(--gold); color:var(--ink); }
  .gt .bar.flag { background:var(--bone); color:var(--slate); border:1px dashed var(--line); }
  .gt .bar.dragging { opacity:.4; }

  /* ---------- preview drawer ---------- */
  .dscrim { position:fixed; inset:0; background:rgba(15,23,42,.25); z-index:55; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:410px; max-width:92vw; background:var(--bone);
    border-left:1px solid var(--line); box-shadow:-24px 0 60px rgba(15,23,42,.12); z-index:60; padding:26px 28px 40px; overflow-y:auto; }
  .drawer .eyebrow { font-size:10.5px; letter-spacing:.16em; color:var(--gold); }
  .drawer h2 { margin:8px 0 14px; font-size:24px; font-weight:600; letter-spacing:-.022em; }
  .drawer .pills { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
  .drawer .desc { font-family:var(--read); font-size:17.5px; line-height:1.6; color:var(--ink); margin:0 0 22px; }
  .drawer .desc.muted { color:var(--slate); }
  .drawer .lab { font-size:10.5px; letter-spacing:.14em; color:var(--gold); text-transform:uppercase; margin:22px 0 10px; }
  .drivebtn { display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--line); border-radius:var(--r-sm); padding:14px 16px; text-align:left; color:var(--ink); text-decoration:none; }
  .drivebtn:hover { border-color:transparent; box-shadow:var(--lift); }
  .drivebtn .g { width:26px; height:26px; border-radius:6px; background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .drivebtn b { display:block; font-size:13.5px; }
  .drivebtn span { font-size:11.5px; color:var(--slate); word-break:break-all; }
  .drawer input.link { width:100%; border:1px solid var(--line); border-radius:var(--r-pill); padding:10px 15px; font-size:12.5px; font-family:var(--mono); }
  .drawer .acts { display:flex; gap:10px; margin-top:26px; }
  .dclose { position:absolute; top:20px; right:22px; color:var(--slate); font-size:18px; padding:4px 9px; border-radius:var(--r-pill); }
  .dclose:hover { color:var(--ink); background:var(--soft); }
  @media (max-width:640px) {
    .drawer { top:auto; bottom:0; width:100%; max-width:none; height:78%; border-left:0; border-top:1px solid var(--line); border-radius:22px 22px 0 0; }
  }

  @media print {
    .nav, .topbar, .bar, .btn, .frow select, .frow .go, .colplus, .drawer, .dscrim { display:none !important; }
    .app, .main, .scroll { display:block; height:auto; overflow:visible; }
    .rows { border:0; }
    .frow { break-inside:avoid; }
  }

  @media (max-width:1100px) { .grid2 { grid-template-columns:1fr; } }
  @media (max-width:860px) {
    .nav { position:fixed; z-index:40; height:100%; width:84vw; max-width:320px; box-shadow:0 0 40px rgba(15,23,42,.3); }
    .app[data-nav="closed"] .nav { display:none; }
    .app[data-nav="open"] .scrim { display:block; position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:35; }
    .burger { display:inline-flex; color:var(--slate); padding:8px 10px; border-radius:var(--r-pill); }
    .topbar { padding:10px 16px; }
    .find { width:auto; flex:1; }
    .kbd { display:none; }
    .head { padding:22px 18px 0; }
    .head .row { flex-wrap:wrap; }
    .bar, .pad { padding-left:18px; padding-right:18px; }
    .lanes { display:block; }
    .lane { min-width:0; margin-bottom:24px; }
    .card { cursor:default; }
    .cardsel { display:block; }
    .frow { flex-wrap:wrap; gap:10px; cursor:default; }
    .frow .body { flex:1 0 60%; }
  }
</style>

<div class="app" id="app" data-nav="open">
  <nav class="nav" id="nav"></nav>
  <div class="scrim" id="scrim" style="display:none"></div>
  <div class="main">
    <div class="topbar">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <input class="find" id="find" placeholder="Search features" aria-label="Search features">
      <span class="kbd">⌘K</span>
    </div>
    <div class="scroll" id="scroll"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "alie-product:v1";
  var STATES = ["Research", "Planned", "Building", "Live", "Needs work", "Feature flag"];
  var ICONS = { roadmap: "▤", features: "◫", parallel: "⋔", timeline: "▦", space: "◆" };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function narrow() { return window.matchMedia("(max-width: 860px)").matches; }
  function mKey(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(0, 2); }
  function dKey(d) { return mKey(d) + "-" + ("0" + d.getDate()).slice(0, 2); }
  function toDate(period) {
    if (!period) return null;
    var p = period.split("-");
    return p.length === 2 ? new Date(+p[0], +p[1] - 1, 1) : new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function weekStart(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - day);
    return x;
  }
  function wKey(d) { return dKey(weekStart(d)); }
  function wAdd(k, n) { var d = toDate(k); d.setDate(d.getDate() + n * 7); return dKey(d); }
  function wLabel(k) {
    var d = toDate(k), e = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 6);
    var a = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    var b = e.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    return a + " to " + b;
  }
  function wShort(k) {
    var d = toDate(k);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function mAdd(k, n) { var p = k.split("-"); return mKey(new Date(+p[0], +p[1] - 1 + n, 1)); }
  function mLong(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
  function mShort(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: "short", year: "2-digit" }); }
  function qOf(k) { var p = k.split("-"); return p[0] + "-Q" + (Math.floor((+p[1] - 1) / 3) + 1); }
  function qLabel(q) { var p = q.split("-"); return p[1] + " " + p[0]; }

  function lanesFor(list, spaceCtx) {
    var ks = keys();
    var lanes;
    if (ui.group === "month") {
      lanes = [{ key: "none", label: laneLabel("none") }]
        .concat(ks.map(function (k) { return { key: k, label: laneLabel(k) }; }))
        .concat([{ key: "later", label: "Later" }]);
    } else if (ui.group === "owner") {
      lanes = S.people.map(function (p) { return { key: p, label: p }; });
    } else {
      lanes = STATES.map(function (s) { return { key: s, label: s }; });
    }

    function keyOf(f) {
      if (ui.group === "month") return laneOfPeriod(f, ks);
      if (ui.group === "owner") return f.owner;
      return f.state;
    }
    function apply(f, k) {
      if (ui.group === "month") f.period = periodFor(k);
      else if (ui.group === "owner") f.owner = k;
      else f.state = k;
      f.updated = Date.now();
    }

    var wrap = el("div", "lanes");
    lanes.forEach(function (lane) {
      var items = list.filter(function (f) { return keyOf(f) === lane.key; });
      var col = el("div", "lane");
      var h = el("h2");
      h.appendChild(el("span", null, lane.label));
      h.appendChild(el("em", null, String(items.length)));

      drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
      drop.addEventListener("drop", function (e) {
        e.preventDefault(); drop.classList.remove("over");
        var f = feature(e.dataTransfer.getData("text/plain"));
        if (!f) return;
        apply(f, lane.key);
        if (spaceCtx && (f.spaces || []).indexOf(spaceCtx) === -1) f.spaces.push(spaceCtx);
        render();
      });

      var plus = el("button", "colplus", "+  New here");

        if (f) { apply(f, lane.key); save(); render(); }
      };
      drop.appendChild(plus);

      if (!items.length) drop.appendChild(el("div", "note", "Empty."));
      items.forEach(function (f) { drop.appendChild(featureCard(f, lane.key, lanes, apply)); });

      col.appendChild(drop);
      wrap.appendChild(col);

    nameIn.value = f.name;
    nameIn.setAttribute("aria-label", "Feature name");
    nameIn.style.cssText = "width:100%;font-size:22px;font-weight:600;letter-spacing:-.02em;border:1px solid transparent;border-radius:12px;padding:10px 12px;margin-bottom:14px;";
    nameIn.onfocus = function () { nameIn.style.borderColor = "var(--line)"; };
    nameIn.onblur = function () { nameIn.style.borderColor = "transparent"; };
    nameIn.oninput = function () { f.name = nameIn.value; f.updated = Date.now(); renderNav(); save(); };
    left.appendChild(nameIn);

    var ta = el("textarea", "writer");
    ta.value = f.note;
    ta.placeholder = "What this feature is, where it stands, what has to happen next, and what the team needs to know.";
    ta.setAttribute("aria-label", "Description");
    ta.oninput = function () { f.note = ta.value; f.updated = Date.now(); save(); };
    left.appendChild(ta);
    g.appendChild(left);

    var right = el("div");

    var p1 = el("div", "panel");
    p1.appendChild(el("h3", null, "Status"));
    [["State", selectOf(STATES, f.state, function (v) { f.state = v; f.updated = Date.now(); render(); }, "State")],
     ["Owner", selectOf(S.people.concat(["+ Add someone"]), f.owner, function (v) {
        if (v === "+ Add someone") {
          var n = prompt("Name");
          if (n && n.trim()) { n = n.trim(); if (S.people.indexOf(n) === -1) S.people.splice(S.people.length - 1, 0, n); f.owner = n; }
        } else f.owner = v;
        f.updated = Date.now(); render();
     }, "Owner")],
     ["Month", selectOf([["none", "No date yet"]].concat(keys().map(function (k) { return [k, laneLabel(k)]; })).concat([["later", "Later"]]),
        f.period ? laneOfPeriod(f, keys()) : "none",
        function (v) { f.period = periodFor(v); f.updated = Date.now(); render(); }, "Month")]
    ].forEach(function (pair) {
      var row = el("div", "field");
      row.appendChild(el("label", null, pair[0]));
      row.appendChild(pair[1]);
      p1.appendChild(row);
    });
    right.appendChild(p1);

    var p2 = el("div", "panel");
    p2.style.marginTop = "18px";
    p2.appendChild(el("h3", null, "Spaces"));
    var chips = el("div");
    chips.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;";
    S.spaces.forEach(function (sp) {
      var c = el("button", "chip", sp);
      c.setAttribute("aria-pressed", String((f.spaces || []).indexOf(sp) !== -1));
      c.onclick = function () {
        f.spaces = f.spaces || [];
        var i = f.spaces.indexOf(sp);
        if (i === -1) f.spaces.push(sp); else f.spaces.splice(i, 1);
        f.updated = Date.now(); render();
      };
      chips.appendChild(c);
    });
    p2.appendChild(chips);
    right.appendChild(p2);

    var p3 = el("div", "panel");
    p3.style.marginTop = "18px";
    p3.appendChild(el("h3", null, "Artifacts"));
    var lk = el("input");
    lk.value = f.link || "";
    lk.placeholder = "Google Drive folder link";
    lk.setAttribute("aria-label", "Drive link");
    lk.style.cssText = "width:100%;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:12.5px;font-family:var(--mono);";
    lk.oninput = function () { f.link = lk.value; save(); };
    p3.appendChild(lk);
    if (f.link) {
      var a = el("a", null, "Open in Drive");
      a.href = f.link; a.target = "_blank"; a.rel = "noopener";
      a.style.cssText = "display:inline-block;margin-top:12px;font-size:13px;color:var(--ink);";
      p3.appendChild(a);
    }
    right.appendChild(p3);

    var p4 = el("div", "panel");
    p4.style.marginTop = "18px";
    p4.appendChild(el("h3", null, "Ships after"));
    var order = feats().filter(function (x) { return x.period; });
    var idx = order.indexOf(f);
    var prev = idx > 0 ? order[idx - 1] : null;
    var next = idx !== -1 && idx < order.length - 1 ? order[idx + 1] : null;
    var line = el("div", "note");
    line.innerHTML = (prev ? "After <b>" + esc(prev.name) + "</b>" : "First on the roadmap") +
      (next ? ", before <b>" + esc(next.name) + "</b>" : "") + ".";
    p4.appendChild(line);
    right.appendChild(p4);

    g.appendChild(right);
    pad.appendChild(g);
    host.appendChild(pad);
  }

  /* --- search --- */

  function renderSearch(host) {
    var q = ui.query.trim().toLowerCase();
    var hits = S.features.filter(function (f) {
      return (f.name + " " + f.note + " " + f.owner + " " + (f.spaces || []).join(" ")).toLowerCase().indexOf(q) !== -1;
    });
    host.appendChild(header("SEARCH", hits.length + (hits.length === 1 ? " result" : " results"), []));
    var pad = el("div", "pad");
    if (!hits.length) pad.appendChild(el("div", "empty", "No match."));
    var rows = el("div", "rows");
    hits.forEach(function (f) { rows.appendChild(featureRow(f, null, f.period ? laneOfPeriod(f, keys()) : "none")); });
    pad.appendChild(rows);
    host.appendChild(pad);
  }

  /* ---------- actions ---------- */

  function create(spaces) {
    var f = { id: uid(), project: S.current, name: "New feature", state: "Planned", owner: "Unassigned",
              spaces: spaces || [], period: null, note: "", link: "", updated: Date.now() };
    S.features.push(f);
    open(f.id);
    return f;
  }
  function open(id) {
    closePreview();
    ui.feature = id; ui.query = "";
    document.getElementById("find").value = "";
    render();
    var t = document.querySelector(".writer");
    if (t) t.blur();
  }

  document.getElementById("burger").onclick = function () {
    var a = document.getElementById("app");
    a.dataset.nav = a.dataset.nav === "open" ? "closed" : "open";
    document.getElementById("scrim").style.display = a.dataset.nav === "open" && narrow() ? "block" : "none";
  };
  document.getElementById("scrim").onclick = function () {
    document.getElementById("app").dataset.nav = "closed";
    document.getElementById("scrim").style.display = "none";
  };
  document.getElementById("find").oninput = function (e) { ui.query = e.target.value; renderView(); };
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("find").focus(); }
    if (e.key === "Escape") closePreview();
  });

  load().then(function () {
    if (narrow()) document.getElementById("app").dataset.nav = "closed";
    render();
  });
})();
</script>
